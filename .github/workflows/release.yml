name: Release

# A `v*` tag builds ripplepath for the runners the action supports and attaches archives plus
# SHA-256 checksums to a GitHub Release. Pull requests that edit this file run the same build
# without publishing anything, so the workflow is exercised before the first tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one static Linux binary that runs regardless of the runner's glibc version.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}" && rustup default stable
      - name: musl C toolchain (tree-sitter and SQLite are C)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        shell: bash
        run: cargo build --release --locked -p ripplepath-cli --target "${{ matrix.target }}"
      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then version="$REF_NAME"; else version="dev-${SHA:0:12}"; fi
          exe=""; if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          name="ripplepath-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/ripplepath$exe" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then 7z a -tzip -bso0 "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          if command -v sha256sum > /dev/null; then sum="$(sha256sum "$name.$ARCHIVE" | cut -d' ' -f1)"; else sum="$(shasum -a 256 "$name.$ARCHIVE" | cut -d' ' -f1)"; fi
          echo "$sum  $name.$ARCHIVE" > "$name.$ARCHIVE.sha256"
          rm -rf "$name"
          "../target/$TARGET/release/ripplepath$exe" --version
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Combined checksums
        working-directory: dist
        run: sha256sum ripplepath-*.tar.gz ripplepath-*.zip > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Ripplepath $TAG" --generate-notes
